# Firebase App Hosting configuration.
# Secrets are referenced by name and must exist in Cloud Secret Manager;
# never inline a secret value here.

runConfig:
  # Right-sized for launch, not for a peak that has not happened yet. One always-on
  # instance at this size is roughly $26/month; at 2 vCPU / 2 GiB it is $53 before a
  # single request. Scale the floor when a measurement says to, not in advance.
  cpu: 1
  memoryMiB: 1024

  # minInstances: 1 is the single most important line in this file.
  #
  # A scale-to-zero backend pays a cold start on the first request after every idle
  # period — several seconds of Node boot plus Next.js server init, on the request a
  # real buyer is waiting for. One warm instance removes that entirely for roughly the
  # price of a coffee a month, and it is the fix for "the backend feels slow".
  # Set to 0 while building and testing — a cold start costs nothing when nobody is
  # waiting, and 0 keeps the bill inside the free tier. Raise to 1 on the day real
  # users arrive: one always-on instance is ~£25/month and removes cold starts
  # entirely. This single line is the difference between the £3-15 and £33-55 stages
  # in docs/21 §21.13.
  minInstances: 1
  maxInstances: 20

  # 80 concurrent requests per instance. Next.js SSR is I/O-bound — most of a request
  # is waiting on Firestore — so one instance serves far more than one user at a time.
  # This is why a single warm instance is enough at launch volume.
  concurrency: 80

  # Cloud Run allows up to 3600s. AI work needs far more than a typical serverless
  # ceiling: a full event build (docs/04 M22) is 35-45 ACU of model calls and can run
  # past 60 seconds. Anything that would time out on a short-limit platform runs here.
  timeoutSeconds: 300

env:
  # Firebase web config for project `ticketroyality`.
  #
  # These are plain values, not Secret Manager secrets, and that is correct rather
  # than lazy. Every `NEXT_PUBLIC_*` variable is inlined into the JavaScript bundle at
  # build time — the prefix means exactly that — so all six are already readable by
  # anyone who opens the site. Storing a value in Secret Manager that is published to
  # every visitor adds six setup steps and six ways to mistype a deploy, and protects
  # nothing.
  #
  # What actually protects the data is `firestore.rules`, plus App Check when it is
  # enabled. The Firebase API key is an identifier, not a credential.
  #
  # Worth doing separately: restrict this key in the Google Cloud console
  # (APIs & Services → Credentials → HTTP referrers → ticketroyality.com/*) so it
  # cannot be used to bill quota from someone else's site.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAR2vz9oFkiBIeSMHkxJYTiMGdrORucDYo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ticketroyality.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ticketroyality
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ticketroyality.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "15675127953"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:15675127953:web:d66fcdc5387dd492c7a730
    availability:
      - BUILD
      - RUNTIME
  # Maps is not wired to a key yet — the event page falls back to a text address
  # panel. Add it back as a value here once a key exists and is referrer-restricted.
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ticketroyality.com
    availability:
      - BUILD
      - RUNTIME

  # ── Server-only secrets ────────────────────────────────────────────────────
  #
  # ALL COMMENTED OUT FOR THE FIRST ROLLOUT.
  #
  # App Hosting fails a rollout when a declared secret is missing from Secret
  # Manager, so referencing a key that does not exist yet blocks the entire deploy
  # — including the catalogue, the blog and everything that needs no keys at all.
  #
  # Re-enable one at a time as each key becomes available:
  #
  #   firebase apphosting:secrets:set <NAME>
  #   (uncomment the block below, commit, push — App Hosting redeploys on push)
  #
  # What each one costs while it stays off is noted against it. None of them stop
  # the site being live; they stop it taking money, sending mail or calling AI.
  #
  # Server-only. RUNTIME only — these must never reach the client bundle.
  #
  # Only variables the code actually reads are declared here. App Hosting fails a
  # rollout when a referenced secret is missing from Secret Manager, so declaring one
  # for an unwired feature turns a future intention into a deploy blocker today.
  # Removed until their feature lands: ANTHROPIC_API_KEY and OPENAI_API_KEY (the AI
  # gateway calls Gemini only), QR_SIGNING_KEY (no signing implemented),
  # NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY (checkout redirects server-side).
#  - variable: GEMINI_API_KEY
#    secret: GEMINI_API_KEY
#    availability:
#      - RUNTIME
#  - variable: CRON_SECRET
#    secret: CRON_SECRET
#    availability:
#      - RUNTIME
#  - variable: STRIPE_SECRET_KEY
#    secret: STRIPE_SECRET_KEY
#    availability:
#      - RUNTIME
#  - variable: STRIPE_WEBHOOK_SECRET
#    secret: STRIPE_WEBHOOK_SECRET
#    availability:
#      - RUNTIME
  - variable: SMTP_HOST
    value: smtp.hostinger.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: info@ticketroyality.com
    availability:
      - RUNTIME
#  - variable: SMTP_PASSWORD
#    secret: SMTP_PASSWORD
#    availability:
#      - RUNTIME
  - variable: EMAIL_FROM
    value: TicketRoyality <info@ticketroyality.com>
    availability:
      - RUNTIME

  - variable: BITRIPAY_BASE_URL
    value: https://bitripay.com/pay/sandbox/api/v1
    availability:
      - RUNTIME
