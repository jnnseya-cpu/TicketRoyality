# Firebase App Hosting configuration.
# Secrets are referenced by name and must exist in Cloud Secret Manager;
# never inline a secret value here.

runConfig:
  # Right-sized for launch, not for a peak that has not happened yet. One always-on
  # instance at this size is roughly $26/month; at 2 vCPU / 2 GiB it is $53 before a
  # single request. Scale the floor when a measurement says to, not in advance.
  cpu: 1
  memoryMiB: 1024

  # minInstances: 1 is the single most important line in this file.
  #
  # A scale-to-zero backend pays a cold start on the first request after every idle
  # period — several seconds of Node boot plus Next.js server init, on the request a
  # real buyer is waiting for. One warm instance removes that entirely for roughly the
  # price of a coffee a month, and it is the fix for "the backend feels slow".
  # Set to 0 while building and testing — a cold start costs nothing when nobody is
  # waiting, and 0 keeps the bill inside the free tier. Raise to 1 on the day real
  # users arrive: one always-on instance is ~£25/month and removes cold starts
  # entirely. This single line is the difference between the £3-15 and £33-55 stages
  # in docs/21 §21.13.
  minInstances: 1
  maxInstances: 20

  # 80 concurrent requests per instance. Next.js SSR is I/O-bound — most of a request
  # is waiting on Firestore — so one instance serves far more than one user at a time.
  # This is why a single warm instance is enough at launch volume.
  concurrency: 80

  # Cloud Run allows up to 3600s. AI work needs far more than a typical serverless
  # ceiling: a full event build (docs/04 M22) is 35-45 ACU of model calls and can run
  # past 60 seconds. Anything that would time out on a short-limit platform runs here.
  timeoutSeconds: 300

env:
  # Firebase web config for project `ticketroyality`.
  #
  # These are plain values, not Secret Manager secrets, and that is correct rather
  # than lazy. Every `NEXT_PUBLIC_*` variable is inlined into the JavaScript bundle at
  # build time — the prefix means exactly that — so all six are already readable by
  # anyone who opens the site. Storing a value in Secret Manager that is published to
  # every visitor adds six setup steps and six ways to mistype a deploy, and protects
  # nothing.
  #
  # What actually protects the data is `firestore.rules`, plus App Check when it is
  # enabled. The Firebase API key is an identifier, not a credential.
  #
  # Worth doing separately: restrict this key in the Google Cloud console
  # (APIs & Services → Credentials → HTTP referrers → ticketroyality.com/*) so it
  # cannot be used to bill quota from someone else's site.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: AIzaSyAR2vz9oFkiBIeSMHkxJYTiMGdrORucDYo
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: ticketroyality.firebaseapp.com
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: ticketroyality
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: ticketroyality.firebasestorage.app
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "15675127953"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: 1:15675127953:web:d66fcdc5387dd492c7a730
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_SITE_URL
    value: https://ticketroyality.com
    availability:
      - BUILD
      - RUNTIME

  # ── Advertising / analytics tags (owner-authorised; Meta is a vendor the owner
  #    added by direction on 20 Aug 2026) ─────────────────────────────────────
  #
  # Empty values mean the tags simply do not load — no scripts, no consent banner.
  # Set the Pixel ID from Meta Events Manager and the G-XXXX measurement id from
  # Google Analytics, then roll out. They are public by nature: every site ships
  # its pixel ids in the page source.
  - variable: NEXT_PUBLIC_META_PIXEL_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  - variable: NEXT_PUBLIC_GA_MEASUREMENT_ID
    value: ""
    availability:
      - BUILD
      - RUNTIME

  # ── Server-only secrets ────────────────────────────────────────────────────
  #
  # RUNTIME only, always. A secret marked BUILD is inlined into the build and can
  # reach the client bundle; none of these may.
  #
  # THE RULE THAT MATTERS: App Hosting fails the whole rollout when a declared
  # secret is missing from Secret Manager. A name listed here that does not exist
  # in Secret Manager takes down the catalogue, the blog and every page that needs
  # no keys at all — not just the feature the key belongs to.
  #
  # So the order is always: create the secret first, then uncomment, then push.
  #
  #   firebase apphosting:secrets:set STRIPE_SECRET_KEY --project ticketroyality
  #   firebase apphosting:secrets:grantaccess STRIPE_SECRET_KEY \
  #     --backend ticketroyality --project ticketroyality
  #
  # The grant is not optional. Creating a secret the backend's service account
  # cannot read produces a rollout that fails at container start with a permission
  # error rather than at deploy time, which is a far more confusing failure.
  #
  # Each block below notes what stays broken while it is commented out.

  # AI gateway. Any ONE of these three is enough to run every AI feature — the
  # gateway falls back Gemini -> Claude -> OpenAI (src/backend/ai/gateway.ts).
  # Gemini leads on cost, so enable it first; the other two buy resilience, which
  # is why all three are worth having rather than any single one.
  # While all three are off: /api/ai returns 503 and AI Studio shows its error state.
  - variable: GEMINI_API_KEY
    secret: GEMINI_API_KEY
    availability:
      - RUNTIME
  - variable: ANTHROPIC_API_KEY
    secret: ANTHROPIC_API_KEY
    availability:
      - RUNTIME
  - variable: OPENAI_API_KEY
    secret: OPENAI_API_KEY
    availability:
      - RUNTIME

  # Cards. While off: checkout cannot create a Stripe session and card payment
  # fails honestly at the button. STRIPE_WEBHOOK_SECRET is what makes the webhook
  # trustworthy — without it a forged POST to /api/stripe-webhook would be taken at
  # face value, so never enable the secret key without it.
  - variable: STRIPE_SECRET_KEY
    secret: STRIPE_SECRET_KEY
    availability:
      - RUNTIME
  - variable: STRIPE_WEBHOOK_SECRET
    secret: STRIPE_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # Scheduled sweeps (/api/cron/*). While off: the cron routes refuse every caller, so
  # nothing releases stale checkout holds, closes auction lots, or delivers webhooks.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability:
      - RUNTIME

  # Hashes public API keys. While unset the key store falls back to QR_SIGNING_KEY, and
  # if neither is set `createKey` refuses outright rather than hashing with an empty
  # string — a key hashed with a constant is not hashed, and storing it that way is the
  # same as storing it in plaintext.
  # Commented out until the secret exists, following the same convention as BitriPay
  # below. App Hosting validates every secret reference when it builds a rollout, so a
  # reference to a secret nobody has created yet fails the whole deploy — and the failure
  # looks like "nothing is deploying" rather than "one line in this file is early".
  #
  # Create it, then uncomment:
  #   npx firebase apphosting:secrets:set API_KEY_SECRET --project ticketroyality
  #
  # Until then the key store falls back to QR_SIGNING_KEY, which is set, so the public
  # API keeps working — it is the fallback the module was written to have.
#  - variable: API_KEY_SECRET
#    secret: API_KEY_SECRET
#    availability:
#      - RUNTIME

  - variable: SMTP_HOST
    value: smtp.hostinger.com
    availability:
      - RUNTIME
  - variable: SMTP_PORT
    value: "465"
    availability:
      - RUNTIME
  - variable: SMTP_USER
    value: info@ticketroyality.com
    availability:
      - RUNTIME
  - variable: SMTP_PASSWORD
    secret: SMTP_PASSWORD
    availability:
      - RUNTIME
  - variable: EMAIL_FROM
    value: TicketRoyality <info@ticketroyality.com>
    availability:
      - RUNTIME

  - variable: BITRIPAY_BASE_URL
    value: https://bitripay.com/pay/sandbox/api/v1
    availability:
      - RUNTIME
  # Uncomment both when BitriPay goes live, after creating the secrets:
  #
  #   firebase apphosting:secrets:set BITRIPAY_CLIENT_ID --project ticketroyality
  #   firebase apphosting:secrets:set BITRIPAY_SECRET_ID --project ticketroyality
  #   firebase apphosting:secrets:grantaccess BITRIPAY_CLIENT_ID \
  #     --backend ticketroyality --project ticketroyality
  #
  # Nothing else needs changing. The checkout button is hidden while
  # BITRIPAY_CLIENT_ID is absent and appears on its own once it is set —
  # `/api/health` reports the rail and `usePaymentMethods()` reads it — so a
  # payment method that cannot work is never offered to a buyer.
#  - variable: BITRIPAY_CLIENT_ID
#    secret: BITRIPAY_CLIENT_ID
#    availability:
#      - RUNTIME
#  - variable: BITRIPAY_SECRET_ID
#    secret: BITRIPAY_SECRET_ID
#    availability:
#      - RUNTIME

  # ── KODA mobile money ──────────────────────────────────────────────────────
  #
  # These were absent from this file entirely, which meant setting them in Secret
  # Manager would have changed nothing: App Hosting only injects what is declared
  # here, so the running container never saw them and `isKodaConfigured()` stayed
  # false however carefully the secrets were created.
  #
  # Use an sk_test_ key first. The sandbox references in src/backend/payments/koda.ts
  # (TEST-OK-25000, TEST-LATE-90, TEST-REPLAY, TEST-SUFFIX) drive verified, late,
  # replayed and mismatched outcomes deterministically, so the whole path can be
  # exercised before real money moves.
  - variable: KODA_BASE_URL
    value: https://kodajnn.com/v1
    availability:
      - RUNTIME
  - variable: KODA_SECRET_KEY
    secret: KODA_SECRET_KEY
    availability:
      - RUNTIME
  # Without this the webhook at /webhooks/koda rejects every delivery with a 401,
  # because verifyWebhook() returns false when the secret is unset. That is the
  # correct failure — an unverified payment webhook must never mint tickets — but it
  # means mobile money silently issues nothing until this is set.
  - variable: KODA_WEBHOOK_SECRET
    secret: KODA_WEBHOOK_SECRET
    availability:
      - RUNTIME

  # ── Google Maps ────────────────────────────────────────────────────────────
  #
  # NEXT_PUBLIC_, so it is a plain value and not a Secret Manager secret: the key
  # ships inside the JavaScript bundle either way, and storing a published value in
  # Secret Manager protects nothing while adding a way to break the deploy.
  #
  # What protects it is a referrer restriction. In the Google Cloud console:
  # APIs & Services -> Credentials -> the key -> Application restrictions ->
  # HTTP referrers -> ticketroyality.com/* and *.hosted.app/*. Without that,
  # anyone can lift the key and bill Maps usage to this project.
  #
  # While unset the event page falls back to a text address panel, which is a
  # deliberate degradation rather than an error.
  - variable: NEXT_PUBLIC_GOOGLE_MAPS_API_KEY
    value: AIzaSyBDh4h9zx_KLeOfhGLsyhGx6o-gdf53uDQ
    availability:
      - BUILD
      - RUNTIME

  # A *second*, server-side key, for /api/geocode — which turns the venue an organiser
  # types into the latitude and longitude the map and distance search need.
  #
  # It cannot be the key above. That one is restricted to HTTP referrers, and referrer
  # restrictions apply to the Maps JavaScript, Embed and Static APIs — not to the
  # Geocoding web service, which is a server-to-server call carrying no referrer. Reusing
  # it produces REQUEST_DENIED.
  #
  # In the console: create a key, Application restrictions -> None (it is never exposed
  # to a browser), API restrictions -> Geocoding API only. Then:
  #   firebase apphosting:secrets:set GOOGLE_MAPS_SERVER_KEY
  #
  # Commented out until the secret exists — App Hosting validates every secret reference
  # at rollout, so declaring one that is missing fails the deploy. Uncomment after
  # creating it. While unset, the coordinate fields stay hand-editable and the route says
  # so rather than failing silently.
  #
  # - variable: GOOGLE_MAPS_SERVER_KEY
  #   secret: GOOGLE_MAPS_SERVER_KEY
  #   availability:
  #     - RUNTIME
